<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0a1017">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>FAULTLINE | Rage Platformer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
    #game-container {
      width: 100vw; height: 100vh;
      position: fixed; top: 0; left: 0;
    }
    #game-container canvas { display: block; }
    #rotate-notice {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: #0a0e14; color: #ffb46a;
      font: 700 24px system-ui, sans-serif;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #rotate-notice span { font-size: 14px; color: #a8b4bd; font-weight: 400; }
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-notice { display: flex; }
      #game-container { display: none; }
    }
  </style>
</head>
<body>
  <div id="rotate-notice">
    ↻ <strong>Rotate to Landscape</strong>
    <span>Turn your device sideways to play FAULTLINE</span>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
